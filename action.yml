name: readwright
description: Check or render README.md from a Jinja2 template with readwright
branding:
  icon: book-open
  color: blue
inputs:
  mode:
    description: "'check' fails when README.md is stale; 'render' rewrites it"
    required: false
    default: check
  root:
    description: Repository subdirectory to run in
    required: false
    default: .
  version:
    description: readwright version spec to install (PyPI)
    required: false
    default: ""
  extra-args:
    description: Extra arguments passed to readwright
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
    - name: Run readwright
      shell: bash
      run: |
        spec="readwright${{ inputs.version }}"
        uvx --from "$spec" readwright "${{ inputs.mode }}" -C "${{ inputs.root }}" ${{ inputs.extra-args }}
