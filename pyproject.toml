[project]
name = "mkreadme"
version = "0.3.0"
description = "Render GitHub READMEs from Jinja2 templates with badge and screenshot helpers"
authors = [
    { name = "Garulf", email = "535299+Garulf@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["readme", "jinja2", "badges", "shields", "markdown"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tomli-w>=1.2.0",
    "typer>=0.12",
    "watchfiles>=1.2.0",
]

[project.scripts]
mkreadme = "mkreadme.cli:app"

[project.urls]
Homepage = "https://github.com/Garulf/mkreadme"
Issues = "https://github.com/Garulf/mkreadme/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "tox>=4.0",
    "tox-uv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkreadme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
